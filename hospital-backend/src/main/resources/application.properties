
# Puerto: local 3307, en Azure App Service se toma de la variable PORT (8080)
server.port=${PORT:3307}

# Base de datos: valores locales por defecto, en Azure se sobreescriben con App Settings
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hospital_db_actualizado}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:436152}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Groq API (Chatbot IA) - define GROQ_API_KEY como variable de entorno en local y Azure
groq.api.key=${GROQ_API_KEY:}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
