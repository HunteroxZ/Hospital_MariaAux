<div class="recep-login-page">
  <div class="form-card recep-login-card">
    <div class="recep-login-band">
      <div class="recep-brand">
        <span class="recep-brand-mark" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.6-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6c-2.5 4.4-9.5 9-9.5 9Z"/><path d="M12 7v6M9 10h6"/></svg>
        </span>
        <span class="recep-kicker">Hospital María Auxiliadora · Recepción</span>
      </div>
      <h2>Inicio de Sesión - Recepcionista</h2>
      <p class="recep-login-sub">Acceso del personal de recepción para gestionar citas, pagos y tickets.</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="recep-login-form">
      <div class="recep-field">
        <label for="dni">DNI</label>
        <div class="recep-input-wrap">
          <span class="recep-input-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="11" r="2"/><path d="M5.5 17c.6-1.8 1.7-2.7 3-2.7s2.4.9 3 2.7M14 9h5M14 13h5"/></svg>
          </span>
          <input
            type="text"
            id="dni"
            name="dni"
            [(ngModel)]="dni"
            placeholder="Ingrese su DNI"
            maxlength="8"
            required
          />
        </div>
      </div>

      <div class="recep-field">
        <label for="clave">Contraseña</label>
        <div class="recep-input-wrap">
          <span class="recep-input-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          </span>
          <input
            type="password"
            id="clave"
            name="clave"
            [(ngModel)]="clave"
            placeholder="Ingrese su contraseña"
            required
          />
        </div>
      </div>

      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button type="submit" [disabled]="isLoading" class="recep-btn-primary">
        {{ isLoading ? 'Iniciando sesión...' : 'Iniciar Sesión' }}
      </button>
    </form>

    <div class="form-link">
      <a routerLink="/seleccionar-rol">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Volver a selección de rol
      </a>
    </div>
  </div>
</div>
